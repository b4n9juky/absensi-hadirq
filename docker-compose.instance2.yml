# ================================================
# docker-compose.instance2.yml
# Instance ke-2 Hadirq — jalan di VPS yang sama
# 
# Cara pakai:
#   docker compose -f docker-compose.instance2.yml --env-file .env.instance2 up -d
#
# Prasyarat:
#   - Instance 1 sudah running (docker compose up -d)
#   - Semua container di network hadirq-network yang sama
#   - nginx.conf sudah ditambahi server block untuk domain baru
# ================================================

services:
  db-s2:
    image: mysql:8.0
    container_name: hadirq-db-s2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hadirq123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-absensi}
      MYSQL_USER: ${MYSQL_USER:-hadirq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hadirq123}
    volumes:
      - db_data_s2:/var/lib/mysql
    networks:
      - hadirq-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-s2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/${GITHUB_REPO_OWNER:-b4n9juky}/absensi-hadirq-backend:latest
    container_name: hadirq-backend-s2
    restart: unless-stopped
    depends_on:
      db-s2:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL:?error}
      - CORS_ORIGIN=${CORS_ORIGIN:?error}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?error}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?error}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      - SCHOOL_LATITUDE=${SCHOOL_LATITUDE:-0.144011}
      - SCHOOL_LONGITUDE=${SCHOOL_LONGITUDE:-117.473191}
      - SCHOOL_RADIUS_METERS=${SCHOOL_RADIUS_METERS:-50}
      - MAX_ACCURACY_METERS=${MAX_ACCURACY_METERS:-30}
      - KIOSK_SECRET_KEY=${KIOSK_SECRET_KEY:-absensi123456}
      - WA_PROXY_URL=${WA_PROXY_URL:-}
    volumes:
      - uploads_data_s2:/app/backend/uploads
      - baileys_auth_data_s2:/app/backend/baileys_auth_info
    networks:
      hadirq-network:
        aliases:
          - backend-s2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/api/config/debug"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  db_data_s2:
  uploads_data_s2:
  baileys_auth_data_s2:

networks:
  hadirq-network:
    external: true
