version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hadirq-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-absensi}
      MYSQL_USER: ${MYSQL_USER:-hadirq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hadirq123}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/drizzle:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - hadirq-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hadirq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - SCHOOL_LATITUDE=${SCHOOL_LATITUDE:-0.144011}
      - SCHOOL_LONGITUDE=${SCHOOL_LONGITUDE:-117.473191}
      - SCHOOL_RADIUS_METERS=${SCHOOL_RADIUS_METERS:-50}
      - MAX_ACCURACY_METERS=${MAX_ACCURACY_METERS:-30}
    volumes:
      - uploads_data:/app/backend/uploads
    ports:
      - "3001:3001"
    networks:
      - hadirq-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/config/debug"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: hadirq-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hadirq-network

volumes:
  db_data:
  uploads_data:

networks:
  hadirq-network:
    driver: bridge